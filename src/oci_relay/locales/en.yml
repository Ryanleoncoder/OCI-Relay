# Interface messages, English.
#
# Keys are referenced from code as dotted paths: `common.overall` reads
# `common: {overall: ...}` below.
#
# Placeholders use `{name}` and are filled by the caller. Keep every
# placeholder that appears here when translating — a missing one falls back
# to the raw text.
#
# Values starting with an emoji are titles; the emoji is part of the string
# so a translation can move it if the language reads better that way.

