# Mensagens da interface, português do Brasil.
#
# Espelha en.yml. Uma chave faltando aqui cai no inglês; um placeholder
# perdido na tradução entrega o texto cru ao usuário — os testes conferem
# as duas coisas.
#
# Termos que são valores da API da OCI ficam em inglês de propósito:
# RUNNING, STOPPED, SOFTSTOP, OCPU, Shape. Traduzi-los divergiria do que o
# console da Oracle mostra.

