name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo cancela a execução anterior do mesmo branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    # Linux é o alvo de deploy: a suíte roda no mesmo sistema operacional
    # em que o Relay vai viver.
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # A mínima declarada no pyproject e uma versão recente.
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Instalar o pacote
        # Valida que o pyproject declara os pacotes corretamente — um
        # módulo esquecido na lista só aparece na instalação.
        run: pip install -e . --no-deps

      - name: Lint
        run: python -m flake8 src/ tests/

      - name: Testes
        # Sem segredos: o conftest define valores de teste, e as chamadas
        # externas são substituídas por dublês.
        run: python -m pytest -q
